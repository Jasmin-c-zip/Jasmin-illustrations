<script>
  const sketchImages = [
    "Image/sketch page1.jpg",
    "Image/sketch cover.png",
    "Image/sketch page2.jpg",
    "Image/sketch page3.jpg",
    "Image/sketch page4.jpg",
    "Image/sketch page5.jpg"
  ];

  // 封面是数组的第 2 张，编号为 1
  let currentSketch = 1;

  
function updateSketchbook() {
  const stage = document.querySelector(
    ".sketchbook-section .sketchbook-stage"
  );

  if (!stage) return;

  const leftPage = stage.querySelector(".sketch-left");
  const centerPage = stage.querySelector(".sketch-center");
  const rightPage = stage.querySelector(".sketch-right");

  if (!leftPage || !centerPage || !rightPage) return;

  const leftImg = leftPage.querySelector("img");
  const centerImg = centerPage.querySelector("img");
  const rightImg = rightPage.querySelector("img");

  const total = sketchImages.length;
  const previous = (currentSketch - 1 + total) % total;
  const next = (currentSketch + 1) % total;

  leftImg.src = sketchImages[previous];
  centerImg.src = sketchImages[currentSketch];
  rightImg.src = sketchImages[next];

  leftImg.alt = "Sketchbook page " + (previous + 1);
  centerImg.alt = "Sketchbook page " + (currentSketch + 1);
  rightImg.alt = "Sketchbook page " + (next + 1);

  // 点击左侧区域
  leftPage.onclick = function() {
    if (sketchImages[previous].includes("sketch cover.png")) {
      window.location.href = "Sketch.html";
    } else {
      changeSketch(-1);
    }
  };

  // 点击中间封面
  centerPage.onclick = function() {
    if (sketchImages[currentSketch].includes("sketch cover.png")) {
      window.location.href = "Sketch.html";
    }
  };

  // 点击右侧区域
  rightPage.onclick = function() {
    if (sketchImages[next].includes("sketch cover.png")) {
      window.location.href = "Sketch.html";
    } else {
      changeSketch(1);
    }
  };

  leftPage.style.cursor = "pointer";
  centerPage.style.cursor = "pointer";
  rightPage.style.cursor = "pointer";
}

function changeSketch(direction) {
  const total = sketchImages.length;

  currentSketch = (currentSketch + direction + total) % total;

  updateSketchbook();
}
  updateSketchbook();
</script>
